[project]
name = "ozon-seller-mcp"
version = "0.1.0"
description = "Локальная аналитика Ozon Seller для Goose"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp[cli]>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ozon-seller-mcp = "ozon_seller_mcp.server:main"
ozon-seller-sync = "ozon_seller_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ozon_seller_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
